# Деплой в Dokploy: сервис типа Compose, путь к файлу — docker-compose.yml. Подробно — docs/DEPLOY.md.
#
# Домены назначаются в UI Dokploy (Domains): web → порт 3000, при необходимости api → 8787
# (для нативных клиентов; боту не нужно — он во внутренней сети). Traefik-метки Dokploy добавляет
# сам. Распознаватель наружу не выставляется — только внутренняя сеть.
#
# Артефакты модели лежат в репозитории (artifacts/) и запекаются в образ распознавателя —
# внешние адреса и токены для деплоя не нужны.
#
# Переменные (Dokploy → Environment пишет их в .env рядом с этим файлом):
#   DATABASE_URL      Postgres с каталогом вин (обязательно)
#   CORS_ORIGINS      origin браузерных клиентов с чужих доменов; веб ходит через свой /api
#   SCAN_ARCHIVE      off — не сохранять прод-сканы (по умолчанию on: фото в том scans, строка в label_scans)
#   MATCHER_VERSION   версия релиза модели в строке скана, например siglip2-b16-ft1-e4
#   ADMIN_PASSWORD    включает раздел разметки на web/admin (не короче 12 символов); пусто — раздела нет
#   COMPOSE_PROFILES=bot  включает Telegram-бота; тогда нужен TELEGRAM_BOT_TOKEN, по желанию WEB_APP_URL
services:
  recognizer:
    build:
      context: .
      dockerfile: deploy/recognizer.Dockerfile
    restart: unless-stopped
    environment:
      # Пусто — модель из образа. Заполнить, чтобы подменить её бандлом по адресу, без пересборки:
      # тогда обязателен и ARTIFACTS_SHA256, а ARTIFACTS_TOKEN нужен для приватного релиза GitHub.
      # Тома нет — подменённый бандл скачивается заново на каждый рестарт.
      ARTIFACTS_URL: ${ARTIFACTS_URL:-}
      ARTIFACTS_SHA256: ${ARTIFACTS_SHA256:-}
      ARTIFACTS_TOKEN: ${ARTIFACTS_TOKEN:-}
      RECOGNIZER_MAX_IN_FLIGHT: ${RECOGNIZER_MAX_IN_FLIGHT:-4}
      # Отказ «нет в каталоге» только для контракта организатора (/v1/eval/predict); API решает сам.
      EVAL_MIN_VISUAL: ${EVAL_MIN_VISUAL:-0}
    expose:
      - "8080"
    networks:
      - internal

  api:
    build:
      context: platform
      dockerfile: ../deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      RECOGNIZER: model
      RECOGNIZER_URL: http://recognizer:8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL не задан}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RECOGNIZE_TIMEOUT_MS: ${RECOGNIZE_TIMEOUT_MS:-30000}
      # Архив сканов: фото в том scans, строка в label_scans (source=production).
      # Это данные для дообучения и для разметки, поэтому по умолчанию включён.
      SCAN_ARCHIVE: ${SCAN_ARCHIVE:-on}
      SCAN_ARCHIVE_DIR: /data/scans
      # Версия релиза модели, с которой получено предсказание; пусто — запишется имя распознавателя
      MATCHER_VERSION: ${MATCHER_VERSION:-}
      # Очередь разметки /v1/admin/*: пусто — роутов нет вовсе, наружу ничего не торчит.
      # Тот же секрет задан вебу: им он подписывает свою cookie и им же ходит в это API.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - scans:/data/scans
    expose:
      - "8787"
    depends_on:
      - recognizer
    networks:
      - internal
      - dokploy-network

  web:
    build:
      context: platform
      dockerfile: ../deploy/web.Dockerfile
      args:
        WINVINO_API_URL: http://api:8787
    restart: unless-stopped
    environment:
      # Адрес API нужен ещё и в рантайме: страницы /admin ходят в него с сервера, мимо прокси /api/*.
      WINVINO_API_URL: http://api:8787
      # Пусто — раздела разметки нет: /admin отвечает 404. Значение обязано совпадать с api.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - internal
      - dokploy-network

  # Включается профилем: без COMPOSE_PROFILES=bot деплой идёт как раньше, без бота и его токена.
  # Long polling — порт и домен не нужны; в Telegram бот ходит сам.
  bot:
    profiles: [bot]
    build:
      context: platform
      dockerfile: ../deploy/bot.Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WINVINO_API_URL: http://api:8787
      # HTTPS-адрес веба для кнопки Mini App; пусто — бот без кнопки
      WEB_APP_URL: ${WEB_APP_URL:-}
    depends_on:
      - api
    networks:
      - internal

# Фотографии сканов переживают пересборку образа: это набор для дообучения, а не кеш.
volumes:
  scans:

networks:
  internal:
  # Сеть Traefik в Dokploy. Локально перед `docker compose up`: docker network create dokploy-network
  dokploy-network:
    external: true
